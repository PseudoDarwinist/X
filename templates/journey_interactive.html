<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #fafafa;
            color: #1d1d1f;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 60px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #007aff 0%, #5856d6 100%);
            transform: translateX(-50%);
            opacity: 0.3;
        }

        .milestone {
            position: relative;
            margin: 60px 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .milestone.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .milestone:nth-child(odd) {
            text-align: right;
            padding-right: 55%;
        }

        .milestone:nth-child(even) {
            text-align: left;
            padding-left: 55%;
        }

        .milestone-content {
            background: white;
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            position: relative;
            display: inline-block;
            min-width: 300px;
            transition: all 0.3s ease;
        }

        .milestone-content:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .milestone-dot {
            position: absolute;
            left: 50%;
            top: 24px;
            width: 16px;
            height: 16px;
            background: #007aff;
            border: 4px solid white;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .milestone:hover .milestone-dot {
            width: 20px;
            height: 20px;
            top: 22px;
        }

        .milestone-dot.education {
            background: #5856d6;
            box-shadow: 0 2px 8px rgba(88, 86, 214, 0.3);
        }

        .milestone-year {
            font-size: 14px;
            font-weight: 600;
            color: #007aff;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }

        .milestone-year.education {
            color: #5856d6;
        }

        .milestone-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        .milestone-org {
            font-size: 16px;
            color: #6e6e73;
            margin-bottom: 12px;
        }

        .milestone-details {
            font-size: 14px;
            color: #86868b;
            line-height: 1.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 80px 0;
            opacity: 0;
            animation: fadeIn 1s ease 0.4s forwards;
        }

        .stat-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: #007aff;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #6e6e73;
            font-weight: 500;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
                margin-bottom: 40px;
            }

            .milestone:nth-child(odd),
            .milestone:nth-child(even) {
                text-align: left;
                padding-left: 40px;
                padding-right: 0;
            }

            .timeline-line {
                left: 16px;
            }

            .milestone-dot {
                left: 16px;
            }

            .milestone-content {
                min-width: auto;
            }
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Selection color */
        ::selection {
            background: #007aff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Career Journey</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalYears">0</div>
                <div class="stat-label">Years Experience</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCompanies">0</div>
                <div class="stat-label">Companies</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRoles">0</div>
                <div class="stat-label">Roles</div>
            </div>
        </div>

        <div class="timeline">
            <div class="timeline-line"></div>
            <!-- Milestones will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        // Sample data - replace with actual resume data
        const milestones = {{MILESTONES_DATA}};

        // Calculate stats
        const workMilestones = milestones.filter(m => m.type === 'work');
        const educationMilestones = milestones.filter(m => m.type === 'education');

        // Animate numbers
        function animateValue(id, start, end, duration) {
            const element = document.getElementById(id);
            const range = end - start;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const value = Math.floor(start + range * easeOut);
                element.textContent = value;

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        // Set stats with animation
        window.addEventListener('load', () => {
            const totalYears = Math.max(...workMilestones.map(m => {
                const start = new Date(m.start_year, 0, 1);
                const end = m.end_year ? new Date(m.end_year, 11, 31) : new Date();
                return (end - start) / (1000 * 60 * 60 * 24 * 365.25);
            }).filter(y => !isNaN(y)));

            const companies = new Set(workMilestones.map(m => m.organization)).size;

            animateValue('totalYears', 0, Math.round(totalYears) || workMilestones.length * 2, 1500);
            animateValue('totalCompanies', 0, companies || workMilestones.length, 1500);
            animateValue('totalRoles', 0, milestones.length, 1500);
        });

        // Create milestone elements
        const timeline = document.querySelector('.timeline');

        milestones.forEach((milestone, index) => {
            const div = document.createElement('div');
            div.className = 'milestone';

            const dot = document.createElement('div');
            dot.className = `milestone-dot ${milestone.type}`;

            const content = document.createElement('div');
            content.className = 'milestone-content';

            const year = document.createElement('div');
            year.className = `milestone-year ${milestone.type}`;
            year.textContent = milestone.start_year + (milestone.end_year ? `-${milestone.end_year}` : '-Present');

            const title = document.createElement('div');
            title.className = 'milestone-title';
            title.textContent = milestone.title;

            const org = document.createElement('div');
            org.className = 'milestone-org';
            org.textContent = milestone.organization;

            content.appendChild(year);
            content.appendChild(title);
            content.appendChild(org);

            div.appendChild(dot);
            div.appendChild(content);
            timeline.appendChild(div);

            // Trigger animation
            setTimeout(() => {
                div.classList.add('visible');
            }, index * 150);
        });

        // Scroll reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.milestone').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
